<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/enviar-contacto" method="POST">
    <div>
    <label for="nombreCompleto">Nombre completo:</label>
    <input type="text" id="nombreCompleto" name="nombre" required>
    </div>
    <div>
    <label for="correoElectronico">Correo eletrónico:</label>
    <input type="email" id="correoElectronico" name="email" required>
    </div>
    <div>
    <label for="contraseña">Crear contraseña:</label>
    <input type="password" id="contraseña" name="contraseña" required>
    </div>
    <label for="tallerInteres">Taller de interés:</label>
    <select name="selecionar">
        <option value="Fotografia">Fotografia</option>
        <option value="Arte">Arte</option>
        <option value="Danza">Danza</option>
    </select>
    <div>
     <legend>Asistencia:</legend>   
        <div>
        <input type="radio" id="Presencial" name="asistencia" value="Presencial"/>
        <label for="Presencial">Presencial</label>
        </div>
        <div>
        <input type="radio" id="Virtual" name="asistencia" value="Virtual"/>
        <label for="Virtual">Virtual</label>
        </div>
    </div>
    <div>
    <label for="condiciones">Acepto las condiciones y términos:</label>
    <input type="checkbox" id="condiciones" name="Acepto">
    </div>
    <div>
    <label for="comentarios">Comentarios adicionales:</label>
    <input type="textarea" id="comentarios" rows="5">
    </div>
    <div>
    <button type="submit">Inscribirme</button>
    </div>
</form>
</body>
</html>
